<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cameraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lensGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="documentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7fafc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Document behind camera -->
  <rect x="72" y="32" width="40" height="54" rx="4" fill="url(#documentGradient)" stroke="#e2e8f0" stroke-width="2" transform="rotate(15 92 59)"/>
  
  <!-- Document lines -->
  <g transform="rotate(15 92 59)">
    <line x1="78" y1="42" x2="106" y2="42" stroke="#cbd5e0" stroke-width="2"/>
    <line x1="78" y1="48" x2="106" y2="48" stroke="#cbd5e0" stroke-width="2"/>
    <line x1="78" y1="54" x2="100" y2="54" stroke="#cbd5e0" stroke-width="2"/>
    <line x1="78" y1="60" x2="104" y2="60" stroke="#cbd5e0" stroke-width="2"/>
  </g>
  
  <!-- Camera body -->
  <rect x="20" y="35" width="60" height="42" rx="8" fill="url(#cameraGradient)" filter="url(#shadow)"/>
  
  <!-- Camera top -->
  <rect x="28" y="28" width="44" height="12" rx="6" fill="url(#cameraGradient)"/>
  
  <!-- Camera lens outer ring -->
  <circle cx="50" cy="56" r="18" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
  
  <!-- Camera lens -->
  <circle cx="50" cy="56" r="14" fill="url(#lensGradient)"/>
  
  <!-- Lens inner circle -->
  <circle cx="50" cy="56" r="10" fill="#1a202c"/>
  
  <!-- Lens reflection -->
  <circle cx="46" cy="52" r="4" fill="#4a5568" opacity="0.7"/>
  <circle cx="47" cy="51" r="2" fill="#ffffff" opacity="0.4"/>
  
  <!-- Flash -->
  <circle cx="30" cy="32" r="3" fill="#f7fafc" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Viewfinder -->
  <rect x="56" y="30" width="8" height="6" rx="1" fill="#2d3748"/>
  
  <!-- Scan lines effect -->
  <g opacity="0.3">
    <line x1="15" y1="45" x2="85" y2="45" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="15" y1="50" x2="85" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <line x1="15" y1="55" x2="85" y2="55" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <line x1="15" y1="60" x2="85" y2="60" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <line x1="15" y1="65" x2="85" y2="65" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Corner focus indicators -->
  <g stroke="#10b981" stroke-width="3" fill="none" opacity="0.8">
    <!-- Top left -->
    <path d="M 25 25 L 25 35 M 25 25 L 35 25"/>
    <!-- Top right -->
    <path d="M 103 25 L 93 25 M 103 25 L 103 35"/>
    <!-- Bottom left -->
    <path d="M 25 103 L 35 103 M 25 103 L 25 93"/>
    <!-- Bottom right -->
    <path d="M 103 103 L 103 93 M 103 103 L 93 103"/>
  </g>
</svg>